server:
  port: 8081

spring:
  application:
    name: itinerary-service
  datasource:
    # Defaults are for local development only; override with environment variables elsewhere.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/itinerary}
    username: ${DB_USER:itinerary}
    password: ${DB_PASSWORD:itinerary}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate          # schema comes from db/schema.sql, Hibernate only verifies it
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  sql:
    init:
      mode: always                 # run db/schema.sql on every start (it is idempotent)
      schema-locations: classpath:db/schema.sql
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    publisher-confirm-type: correlated   # broker confirms are required before an outbox row is marked published

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

itinerary:
  messaging:
    exchange: itinerary.events
    confirmed-routing-key: itinerary.confirmed
    # A queue bound to the exchange so events are visible in the RabbitMQ UI before invoice-service exists.
    # Set to false once invoice-service declares its own queue.
    debug-queue-enabled: true
    debug-queue: itinerary.confirmed.debug
  outbox:
    poll-interval-ms: 1000
    batch-size: 50
